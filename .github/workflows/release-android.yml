# Builds a signed Android APK and publishes it as a GitHub Release when a
# version tag (v1.2.3) is pushed. The tag must be on main.
# Needs (repo Settings > Secrets and variables > Actions, environment
# "production"): secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD;
# variable API_BASE_URL. See docs/deploy.md, section 4.
name: Release Android

on:
  push:
    tags: ['v*.*.*']

concurrency: release-android

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check tag and settings
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]] || { echo "::error::Tag must look like v1.2.3 (minor and patch below 100)"; exit 1; }
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          case "$API_BASE_URL" in https://*) ;; *) echo "::error::Set the API_BASE_URL variable to the hub's https:// address"; exit 1;; esac
          [ -n "$KEYSTORE" ] || { echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          [ -n "$PASSWORD" ] || { echo "::error::Set the ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          # versionCode must grow with every release: 1.2.3 -> 10203.
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag a commit that is on main"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$PASSWORD"
          } > android/key.properties
      - name: Build APK
        run: >-
          flutter build apk --release
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs" | grep -E 'DN:|SHA-256'
          if echo "$certs" | grep -q 'CN=Android Debug'; then echo "::error::APK is signed with the debug key"; exit 1; fi
      - name: Remove signing key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "homesync-$VERSION.apk"
          gh release create "$TAG" "homesync-$VERSION.apk" --title "HomeSync $VERSION" --generate-notes --verify-tag
